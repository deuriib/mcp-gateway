[project]
name = "mcp-gateway"
version = "0.1.0"
description = "Manage MCP servers with Code Mode support."
readme = "README.md"
authors = [
    { name = "Deuri Vasquez", email = "deuriib@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "click>=8.4.2",
    "httpx>=0.28.1",
    "mcp>=2.0.0",
    "starlark-pyo3>=2026.1.1",
    "starlette>=1.6.0",
    "uvicorn>=0.52.4",
]

[project.scripts]
mcp-gateway = "mcp_gateway.cli:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.4",
]
