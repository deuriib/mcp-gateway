[project]
name = "mcp-gway"
version = "0.1.2"
description = "Manage MCP servers with Code Mode support."
readme = "README.md"
authors = [
    { name = "Deuri Vasquez", email = "deuriib@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "click>=8.4.2",
    "httpx>=0.28.1",
    "mcp>=2.0.0",
    "starlark-pyo3>=2026.1.1",
    "starlette>=1.6.0",
    "uvicorn>=0.52.4",
]

[project.scripts]
mcp-gway = "mcp_gway.cli:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
version_variables = ["src/mcp_gway/__init__.py:__version__"]

[tool.semantic_release.branches.main]
match = "(main|master)"
match_source = true

[tool.semantic_release.commit_parser_options]
allowed_tags = ["build", "chore", "ci", "docs", "feat", "fix", "perf", "refactor", "style", "test"]
minor_tags = ["feat"]
patch_tags = ["fix", "perf"]

[tool.ruff.lint]
ignore = [
    "BLE001",  # Blind exception catching is intentional for graceful degradation
    "SIM117",  # Nested async with required by MCP library API
    "PYI063",  # Pydantic model_post_init has fixed signature
    "SIM102",  # Nested ifs with different error messages are clearer separate
    "B017",    # Tests intentionally catch broad exceptions
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.4",
    "python-semantic-release>=10.0.0",
]
