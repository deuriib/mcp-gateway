name: Release

on:
  push:
    tags: ["v*"]
  workflow_run:
    workflows: ["Tests"]
    types:
      - completed
    branches: [main, master]

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' || github.event.workflow_run.conclusion == 'success' }}
    concurrency: release

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Configure Git
        if: github.event_name == 'workflow_run'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Python Semantic Release
        id: release
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          uv run semantic-release --verbose version 2>&1 | tee /tmp/psr.log
          STATUS=${PIPESTATUS[0]}
          cat /tmp/psr.log
          if [ $STATUS -ne 0 ]; then
            echo "semantic-release exited with $STATUS, retrying with -vv for traceback"
            uv run semantic-release --verbose -vv version 2>&1 | tail -n 150
            exit $STATUS
          fi
          if grep -q "No release will be made" /tmp/psr.log; then
            echo "released=false" >> $GITHUB_OUTPUT
          elif grep -q "has already been released" /tmp/psr.log; then
            echo "released=false" >> $GITHUB_OUTPUT
          elif git describe --exact-match HEAD 2>/dev/null | grep -q "^v"; then
            echo "released=true" >> $GITHUB_OUTPUT
          else
            if git log -1 --pretty=%B | grep -q "Automatically generated by python-semantic-release"; then
              echo "released=true" >> $GITHUB_OUTPUT
            else
              echo "released=false" >> $GITHUB_OUTPUT
            fi
          fi
          exit 0

      - name: Build package
        if: ${{ github.event_name == 'push' || steps.release.outputs.released == 'true' }}
        run: uv build

      - name: Publish to PyPI
        if: ${{ github.event_name == 'push' || steps.release.outputs.released == 'true' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          verbose: true
